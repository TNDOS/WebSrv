# 可选：定时从 GitHub API 刷新 data/versions.json。
#
# 页面本身**不依赖**这个 —— 手动更新清单同样可以（见 README）。
# 这个 workflow 只是让"别忘了更新"自动化。
#
# 注意 API 的匿名限额是每小时 60 次、按 IP 计。CI runner 的出口 IP 是共享的，
# 所以这里用 GH_TOKEN（GitHub 自己发的），带 token 时限额高得多。
name: Refresh version manifest

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh
        env:
          GH_TOKEN: \${{ github.token }}
        run: node tools/refresh.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/versions.json; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/versions.json
          git commit -m "刷新版本清单 Refresh version manifest"
          git push
